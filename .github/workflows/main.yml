
name: CareerConnect CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node, PostgreSQL and automated tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show who pushed and what changed
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Triggered by: $GITHUB_ACTOR"
          echo "Branch: ${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          echo "Workflow commit: $GITHUB_SHA"
          git log -1 --format='Commit author: %an <%ae>%nCommit message: %s'
          echo 'Changed files:'
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]] && \
             git cat-file -e "${PR_BASE_SHA}^{commit}" 2>/dev/null && \
             git cat-file -e "${PR_HEAD_SHA}^{commit}" 2>/dev/null; then
            git diff --name-status "$PR_BASE_SHA" "$PR_HEAD_SHA"
          elif [[ "$GITHUB_EVENT_NAME" == 'push' ]] && \
               [[ "$PUSH_BEFORE" =~ ^[0-9a-f]{40}$ ]] && \
               [[ "$PUSH_BEFORE" != '0000000000000000000000000000000000000000' ]] && \
               git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            git diff --name-status "$PUSH_BEFORE" "$GITHUB_SHA"
          else
            git show --pretty='' --name-status HEAD
          fi

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          git ls-files -z '*.js' | while IFS= read -r -d '' file; do
            node --check "$file" || exit 1
          done

      # npm test discovers every tests/*.test.js file, including new regression tests.
      # Node exits with a nonzero status if any test fails, which fails this CI job.
      # Database tests use isolated PGlite data; AI tests use simulated responses.
      - name: Verify unit and integration tests
        run: npm test
